<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Join a Tavolunio room</title>
  <style>
    :root{--ink:#26332c;--paper:#fff8eb;--tomato:#e16b4e;--leaf:#447b5d}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,"Segoe UI",sans-serif}
    main{max-width:640px;margin:8vh auto;padding:26px}section{background:#fff;border:1px solid #eadfca;border-radius:24px;padding:28px;text-align:center}
    h1{color:#773f32;font-size:clamp(2rem,7vw,3rem);line-height:1.15}#code{font-size:clamp(2.5rem,12vw,4rem);font-weight:800;letter-spacing:.18em;color:#345f72;margin:24px 0}
    button{border:0;border-radius:14px;padding:14px 22px;background:var(--leaf);color:white;font-size:1rem;font-weight:700;cursor:pointer}p{margin:12px 0}small{color:#66584c}
  </style>
</head>
<body><main><section>
  <p>🍽️ Tavolunio</p>
  <h1 id="title">You’ve been invited to play</h1>
  <p id="instructions">Copy this room code, open Tavolunio, choose Multiplayer, and enter the code.</p>
  <div id="code" aria-live="polite">------</div>
  <button id="copy" type="button">Copy room code</button>
  <p id="status" role="status"></p>
  <small id="invalid" hidden>This invite link does not contain a valid room code.</small>
</section></main>
<script>
(() => {
  const code = new URLSearchParams(location.search).get("room") || "";
  const valid = /^[A-HJ-NP-Z2-9]{6}$/i.test(code);
  const codeBox = document.getElementById("code");
  const copyButton = document.getElementById("copy");
  const status = document.getElementById("status");
  codeBox.textContent = valid ? code.toUpperCase() : "------";
  if (!valid) {
    document.getElementById("invalid").hidden = false;
    copyButton.disabled = true;
    return;
  }
  copyButton.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(code.toUpperCase());
      status.textContent = "Room code copied.";
    } catch (_) {
      status.textContent = "Select and copy the room code above.";
    }
  });
})();
</script></body></html>
